app = 'epouch-api'
primary_region = 'cdg'

[build]
  dockerfile = 'apps/api/Dockerfile'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = 'http'
    port = 3001
    path = '/health'
    interval = '30s'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
