name: Deploy API to Netlify

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Path filter — skip deploy if no relevant changes (unless manual trigger)
      - name: Get parent SHA
        if: github.event_name != 'workflow_dispatch'
        id: parent
        run: |
          PARENT_SHA=$(curl -s "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["parents"][0]["sha"])')
          echo "sha=$PARENT_SHA" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            api:
              - 'apps/api/**'
            prisma:
              - 'packages/prisma/**'

      - name: Check if deploy needed
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.filter.outputs.api }}" == "true" || "${{ steps.filter.outputs.prisma }}" == "true" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

      - uses: ./.github/actions/setup
        # if: steps.changed.outputs.result == 'true'

      - name: Build API
        # if: steps.changed.outputs.result == 'true'
        run: pnpm --filter api-financial-app build

      - name: Install Netlify CLI
        # if: steps.changed.outputs.result == 'true'
        run: pnpm install -g netlify-cli

      - name: Deploy to Netlify (Production)
        # if: steps.changed.outputs.result == 'true'
        run: netlify deploy --prod --dir=apps/api/public --functions=apps/api/netlify/functions --site=$NETLIFY_SITE_ID_API --cwd apps/api --message "$DEPLOY_MESSAGE"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID_API: ${{ secrets.NETLIFY_SITE_ID_API }}
          DEPLOY_MESSAGE: "API deploy — ${{ github.event.workflow_run.head_sha || github.sha }}"
