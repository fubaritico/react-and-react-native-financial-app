# @netlify/vite-plugin-react-router generates build/server/server.js
# as the SSR function handler during `react-router build`.

[build]
  command = "react-router build"
  publish = "build/client"

[functions]
  directory = "build/server"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
